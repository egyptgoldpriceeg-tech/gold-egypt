name: add-icon
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon link to all pages
        run: |
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 perl -0pi -e 's|(<meta charset=.utf-8.>)|$1\n<link rel="icon" href="/favicon.svg" type="image/svg+xml">| unless /rel="icon"/'
      - name: Commit and push
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "add favicon"
          git pull --rebase --autostash
          git push
