name: remove-name
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove person from structured data
        run: |
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 perl -0pi -e 's/,\s*"(?:founder|author)"\s*:\s*\{\s*"\@type"\s*:\s*"Person"\s*,\s*"name"\s*:\s*"[^"]*"\s*\}//g'
      - name: Commit and push
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "remove person names from structured data"
          git pull --rebase --autostash
          git push
