name: update-prices
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json index.html sitemap.xml
          git diff --cached --quiet || git commit -m "update prices"
          git pull --rebase --autostash
          git push
